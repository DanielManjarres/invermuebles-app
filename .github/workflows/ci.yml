name: Validacion del proyecto

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Pruebas y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invermuebles_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invermuebles_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invermuebles_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invermuebles_test
      ADMIN_EMAIL: admin@invermuebles.com
      ADMIN_PASSWORD: invermuebles2026

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones en la base de pruebas
        run: npx prisma migrate deploy

      - name: Ejecutar validacion completa
        run: npm test
